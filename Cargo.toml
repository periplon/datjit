[workspace]
members = [
    "crates/datjit-core",
    "crates/datjit-parser",
    "crates/datjit-generator",
    "crates/datjit-output",
    "crates/datjit-corpus",
    "crates/datjit-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
datjit-core = { path = "crates/datjit-core" }
datjit-parser = { path = "crates/datjit-parser" }
datjit-generator = { path = "crates/datjit-generator" }
datjit-output = { path = "crates/datjit-output" }
datjit-corpus = { path = "crates/datjit-corpus" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"

# Error handling
thiserror = "2.0"

# Types
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
indexmap = { version = "2.1", features = ["serde"] }

# Random generation
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"

# Output
csv = "1.3"

# Networking (for corpus updates)
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Regex
regex = "1.10"
